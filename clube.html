<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4FF">
<meta name="robots" content="noindex,nofollow">
<title>Clube de Vantagens doTERRA</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css?v=20261123">
<style>
:root{--l50:#F8F6FF;--l100:#EFE9FF;--l200:#E1D7FF;--l300:#CDBDFF;--l500:#8B6FE0;--l600:#7656D6;--l700:#5E3FBF;--ink:#1D1B26;--muted:#645F78;--line:#E6E0F5;--ok:#2E9F6B;--warn:#B25E09;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,var(--l100) 0,var(--l50) 280px,#fff 100%) fixed;color:var(--ink);font-size:18px;line-height:1.5;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.top img{width:40px;height:40px;border-radius:11px;background:#fff;box-shadow:0 2px 10px rgba(94,63,191,.15)}
.top b{font-size:15px;color:var(--l700);display:block;line-height:1.2}.top span{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--l200);border-radius:99px;overflow:hidden;margin:4px 0 22px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--l500),var(--l600));border-radius:99px;transition:width .35s ease}
.card{background:#fff;border-radius:var(--r);padding:22px 20px;box-shadow:0 8px 30px rgba(94,63,191,.10);border:1px solid var(--line)}
.ico{font-size:34px;margin-bottom:6px}
h1{font-size:27px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:21px;margin:26px 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:16px}
.q{margin:22px 0 4px}.q>label,.q>.lb{display:block;font-weight:650;font-size:19px;margin-bottom:6px}
.dica{font-size:14px;color:var(--muted);margin:-2px 0 8px}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;padding:15px 16px;border:2px solid var(--line);border-radius:16px;background:var(--l50);color:var(--ink);outline:none;transition:border .15s}
input:focus,textarea:focus{border-color:var(--l500);background:#fff}
textarea{min-height:92px;resize:vertical}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:inherit;font-size:17px;padding:14px 16px;min-height:54px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer;transition:.15s}
.opt:active{transform:scale(.985)}
.opt .bx{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--l300);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
.opt.un .bx{border-radius:50%}
.opt.on{border-color:var(--l600);background:var(--l100)}
.opt.on .bx{background:var(--l600);border-color:var(--l600)}
.esc{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.esc button{font:inherit;font-weight:700;padding:13px 0;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink)}
.esc button.on{background:var(--l600);color:#fff;border-color:var(--l600)}
.escl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:20px;font-size:15px;color:var(--muted)}
.chk input{width:24px;height:24px;margin-top:2px;accent-color:var(--l600);flex:none}
.err{color:#C0392B;font-weight:600;font-size:15px;margin-top:12px;min-height:1px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line)}
.foot div{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:16px;padding:16px 20px;min-height:56px;cursor:pointer;background:var(--l600);color:#fff;flex:1;box-shadow:0 6px 16px rgba(118,86,214,.30)}
.btn:active{transform:scale(.985)}.btn.sec{background:var(--l100);color:var(--l700);box-shadow:none;flex:none}
.btn.wa{background:#1FA855;box-shadow:0 6px 16px rgba(31,168,85,.3);display:block;text-align:center;text-decoration:none}
.saved{font-size:12px;color:var(--muted);text-align:right;min-height:16px;margin-top:8px}
.hero{text-align:center;padding:8px 0 6px}.hero .big{font-size:56px}
.kit{display:grid;gap:10px;margin-top:10px}
.oil{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,var(--l50))}
.oil .n{flex:none;width:44px;height:44px;border-radius:14px;background:var(--l600);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.oil b{display:block;font-size:18px}.oil span{font-size:15px;color:var(--muted)}
.tema{margin-top:14px}.tema h3{margin:0 0 6px;font-size:18px}
.pill{display:inline-block;background:var(--l100);color:var(--l700);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:650;margin:0 6px 6px 0}
.aviso{background:#FFF6E8;border:1px solid #F4D9A8;color:#6B4509;border-radius:16px;padding:14px 16px;font-size:15px;margin-top:14px}
.rot{display:grid;gap:8px}.rot div{display:flex;gap:12px;padding:12px 14px;background:var(--l50);border-radius:14px;border:1px solid var(--line);font-size:16px}
.dep{padding:14px 16px;border-left:4px solid var(--l500);background:var(--l50);border-radius:0 14px 14px 0;margin:10px 0;font-size:16px}
.dep small{display:block;color:var(--muted);margin-top:4px}
.fine{font-size:13px;color:var(--muted);margin-top:22px;text-align:center}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
@media(max-width:380px){.esc{grid-template-columns:repeat(5,1fr)}}

input[type=email],input[type=password],input[type=date],select{width:100%;font:inherit;padding:15px 16px;border:2px solid var(--line);border-radius:16px;background:var(--l50);color:var(--ink);outline:none;transition:border .15s;appearance:none;-webkit-appearance:none}
input[type=email]:focus,input[type=password]:focus,input[type=date]:focus,select:focus{border-color:var(--l500);background:#fff}
.q+.q{margin-top:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--l100);color:var(--l700);font:inherit;font-weight:700;font-size:14px;padding:8px 12px;border-radius:12px;cursor:pointer}
.logo{display:block;width:96px;height:96px;margin:0 auto 4px;object-fit:contain}
.ben{display:grid;gap:10px;margin:18px 0 6px}
.ben div{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,var(--l50))}
.ben .i{flex:none;width:44px;height:44px;border-radius:14px;background:var(--l100);display:grid;place-items:center;font-size:24px}
.ben b{display:block;font-size:17px}.ben span{font-size:15px;color:var(--muted)}
.center{text-align:center}
.mini{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Carregando…</div></div>
<div class="foot" id="foot" hidden><div id="footin"></div></div>
<script src="clube.js?v=20261123"></script>
</body>
</html>
